# description only: no url, so no button and no link out
# preview: a larger picture (a GIF) that opens in the page's own lightbox when the icon is clicked
- id: workflows
  title: Workflows
  title_zh: 工作流
  items:
    - title: NOVELVID
      subtitle: 片场
      accent: "#2bb5a0"
      icon: /images/others/workflow-novelvid-icon.gif
      preview: /images/others/workflow-novelvid.gif
      year: 2026
      tags: [AI video, Local LLM, ComfyUI, TTS, Automation]
      blurb: >-
        A pipeline that runs on my own computer and turns a novel, a classical Chinese tale, or a one-line idea into
        finished video episodes. A local language model writes and ComfyUI draws, taking turns on one GPU; a
        background worker runs the steps in order and checks each result before the next step starts. The three
        videos above were made with it.
      facts:
        - "Writing (LLM): episodes, script, casting, storyboard, voice and music design, keyframe prompts, camera moves"
        - "Production (ComfyUI and TTS): character looks, keyframes, voices, music, video clips, upscaling, the final cut"
        - Quality gates on every clip (decoding, frame count, motion, faces, style drift), and an LLM review that sends a failed keyframe or clip back for another take
        - Ten visual styles, from ink wash and 2.5D guofeng animation to live action, and a prompt lab for trying a change on one project before adopting it
      note: >-
        Click the picture to see the interface.
